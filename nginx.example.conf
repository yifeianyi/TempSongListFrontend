# Songlist 模板前端 Nginx 配置示例
# 此配置展示如何为不同歌手配置不同的域名，指向同一个前端应用

# 通用上游配置
upstream songlist_backend {
    server 127.0.0.1:8000;
}

upstream songlist_frontend {
    server 127.0.0.1:5173;
}

# 歌手 1: 乐游
server {
    listen 80;
    server_name youyou.example.com;

    # 前端静态文件
    location / {
        proxy_pass http://songlist_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如果使用热更新）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 后端 API
    location /api {
        proxy_pass http://songlist_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 媒体文件
    location /media {
        proxy_pass http://songlist_backend;
        proxy_set_header Host $host;
    }

    location /photos {
        proxy_pass http://songlist_backend;
        proxy_set_header Host $host;
    }
}

# 歌手 2: 冰洁
server {
    listen 80;
    server_name bingjie.example.com;

    # 前端静态文件
    location / {
        proxy_pass http://songlist_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如果使用热更新）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 后端 API
    location /api {
        proxy_pass http://songlist_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 媒体文件
    location /media {
        proxy_pass http://songlist_backend;
        proxy_set_header Host $host;
    }

    location /photos {
        proxy_pass http://songlist_backend;
        proxy_set_header Host $host;
    }
}

# 生产环境配置（使用构建后的静态文件）
server {
    listen 80;
    server_name youyou.example.com bingjie.example.com;

    # 前端静态文件（生产构建）
    root /path/to/songlist-frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API
    location /api {
        proxy_pass http://songlist_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 媒体文件
    location /media {
        proxy_pass http://songlist_backend;
        proxy_set_header Host $host;
    }

    location /photos {
        proxy_pass http://songlist_backend;
        proxy_set_header Host $host;
    }

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
}

# HTTPS 配置（推荐生产环境使用）
server {
    listen 443 ssl http2;
    server_name youyou.example.com;

    ssl_certificate /path/to/ssl/youyou.example.com.crt;
    ssl_certificate_key /path/to/ssl/youyou.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 前端静态文件
    root /path/to/songlist-frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API
    location /api {
        proxy_pass http://songlist_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 媒体文件
    location /media {
        proxy_pass http://songlist_backend;
        proxy_set_header Host $host;
    }

    location /photos {
        proxy_pass http://songlist_backend;
        proxy_set_header Host $host;
    }
}

# HTTP 重定向到 HTTPS
server {
    listen 80;
    server_name youyou.example.com bingjie.example.com;
    return 301 https://$server_name$request_uri;
}